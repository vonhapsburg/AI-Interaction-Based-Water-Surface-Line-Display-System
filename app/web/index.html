<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基于AI交互的水面线展示系统</title>
<style>
  :root{
    --ink:#16202b; --muted:#5b6b7b; --faint:#8b98a6;
    --line:#dfe4ea; --line2:#eef1f5;
    --bg:#f5f7f9; --card:#ffffff;
    --accent:#1f4e79; --accent2:#2e6da4;
    --sub:#2e6da4; --sup:#c9741f; --crit:#b23c4a;
    --hn:#7d8b99; --ok:#2f7d54; --warn:#a8761f; --err:#b23c4a;
    --shadow:0 1px 2px rgba(22,32,43,.05),0 4px 14px rgba(22,32,43,.05);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .topbar{
    height:52px; background:var(--card); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 16px; position:sticky; top:0; z-index:30;
  }
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0;}
  .brand b{font-size:16px;letter-spacing:.01em;white-space:nowrap;}
  .brand span{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .grow{flex:1;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:#f3f6f9;border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  .dot.off{background:var(--warn);}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .seg button{
    border:0;background:#fff;padding:6px 13px;font-size:12.5px;color:var(--muted);
    cursor:pointer;font-family:inherit;
  }
  .seg button+button{border-left:1px solid var(--line);}
  .seg button.on{background:var(--accent);color:#fff;}
  .layout{
    display:grid;grid-template-columns:400px minmax(0,1fr);gap:14px;
    padding:14px;align-items:start;max-width:1720px;margin:0 auto;
  }
  .left{display:flex;flex-direction:column;gap:12px;}
  .right{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);}
  .card-h{
    display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line2);
    font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  }
  .card-h .tag{margin-left:auto;font-weight:400;color:var(--faint);letter-spacing:0;font-size:11.5px;}
  .syncbadge{
    font-size:11px;padding:1px 8px;border-radius:9px;background:#e9f5ee;color:var(--ok);
    border:1px solid #cfe6d7;opacity:0;transition:opacity .3s;white-space:nowrap;
  }
  .syncbadge.on{opacity:1;}
  .card-b{padding:12px 13px;}

  /* chat */
  .chat-body{height:var(--chat-h,340px);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fcfdfe;}
  .chat-resizer{
    height:9px;cursor:ns-resize;background:#f2f5f8;border-top:1px solid var(--line2);
    position:relative;touch-action:none;
  }
  .chat-resizer::after{
    content:"";position:absolute;left:50%;top:3px;transform:translateX(-50%);
    width:38px;height:3px;border-radius:2px;background:#c6d0da;
  }
  .chat-resizer:hover{background:#e9eff5;}
  .chat-resizer:hover::after{background:#8fa4b8;}
  .msg{max-width:92%;font-size:13.2px;line-height:1.65;padding:8px 11px;border-radius:9px;white-space:pre-wrap;word-break:break-word;}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px;}
  .msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px;}
  .msg.sys{align-self:center;background:#eef3f8;color:var(--muted);font-size:12px;padding:4px 10px;border-radius:99px;}
  .msg .who{display:block;font-size:11px;color:var(--faint);margin-bottom:3px;letter-spacing:.05em;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 9px;align-items:center;}
  .chips-hint{font-size:11px;color:var(--faint);letter-spacing:.03em;white-space:nowrap;}
  .viewctl{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;}
  .xgo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .xgo input{width:82px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;font-family:inherit;}
  .xgo input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(46,109,164,.12);}
  .zoomb{
    width:26px;height:24px;border:1px solid var(--line);background:#fff;border-radius:6px;
    cursor:pointer;font-size:13px;line-height:1;color:var(--muted);font-family:inherit;
  }
  .zoomb:hover{border-color:var(--accent2);color:var(--accent2);}
  .chip{
    font-size:12px;color:var(--accent2);background:#f1f6fb;border:1px solid #d9e6f2;
    border-radius:99px;padding:3px 9px;cursor:pointer;
  }
  .chip:hover{background:#e6f0f9;}
  .chat-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line2);}
  /* 出题：按当前算例生成的教学题（题干/答案来自内核） */
  .quiz{padding:8px 10px;}
  .qitem{margin-bottom:9px;}
  .qitem:last-child{margin-bottom:2px;}
  .qtitle{font-weight:600;margin-bottom:3px;}
  .quiz details{margin-left:2px;}
  .quiz summary{cursor:pointer;color:var(--accent2);font-size:12.5px;}
  .qans{margin-top:4px;color:var(--ink);}
  .qwhy{margin-top:3px;color:var(--muted);font-size:12.5px;}
  .chat-ctx{
    margin:0 12px 8px;padding:5px 9px;border-radius:6px;background:#eef5fb;
    border:1px solid #d5e6f4;color:var(--accent2);font-size:11.8px;line-height:1.5;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .chat-ctx b{color:var(--accent);font-weight:600;}
  .chat-ctx .x{cursor:pointer;color:var(--faint);margin-left:auto;padding:0 4px;}
  .chat-input input{
    flex:1;border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:13px;
    font-family:inherit;outline:none;background:#fff;min-width:0;
  }
  .chat-input input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(46,109,164,.1);}
  button.primary{
    border:0;background:var(--accent);color:#fff;border-radius:7px;padding:8px 15px;
    font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  button.primary:hover{background:#1a4468;}
  button.ghost{
    border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;
    padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;
  }
  button.ghost:hover{border-color:var(--accent2);color:var(--accent2);}
  button:disabled{opacity:.6;cursor:not-allowed;}

  /* form */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
  .field{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .field label{font-size:11.5px;color:var(--faint);letter-spacing:.03em;}
  .field input,.field select{
    border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;
    font-family:inherit;outline:none;background:#fff;color:var(--ink);width:100%;
  }
  .field input:focus,.field select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(46,109,164,.1);}
  .field input:disabled{background:#f7f9fb;color:var(--faint);}
  .reachbox{background:#fafbfc;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;margin:4px 0 11px;}
  .reachbox-h{font-size:11.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:baseline;}
  .reachbox-h .sub{color:var(--faint);font-size:11px;}
  table.reach{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.reach th{font-weight:500;color:var(--faint);font-size:11px;text-align:left;padding:0 4px 4px;}
  table.reach td{padding:2px 4px;}
  table.reach input{
    width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:12.5px;
    font-family:inherit;outline:none;
  }
  table.reach input:focus{border-color:var(--accent2);}
  table.reach td.segno{
    color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; padding-right:6px;
  }
  .segdot{
    display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle;
  }
  .segdot.s0{background:#2e6da4;}
  .segdot.s1{background:#c9741f;}
  .segdot.s2{background:#2f7d54;}
  .segdot.s3{background:#7a3b0e;}
  .reachsum-form{margin-top:7px;display:flex;flex-direction:column;gap:3px;}
  .rline{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.6;}
  .rline .rname{color:var(--ink);font-weight:600;}
  .rline .rrange{color:var(--faint);font-variant-numeric:tabular-nums;}
  .rline .sub{color:var(--faint);}
  .rline b.t-mild{color:var(--sub);}
  .rline b.t-steep{color:var(--sup);}
  .rline b.t-other{color:var(--faint);}
  .curvepill{
    font-size:11px;padding:0 6px;border-radius:9px;background:#eef3f8;color:var(--accent);
    border:1px solid #d7e4ef;
  }
  /* 对话同步反馈 */
  @keyframes flashBg{
    0%{background:#fff6d8;border-color:#e0b877;box-shadow:0 0 0 3px rgba(224,184,119,.25);}
    100%{background:#fff;border-color:var(--line);box-shadow:none;}
  }
  input.flash,select.flash{animation:flashBg 1.4s ease-out;}
  /* 示例算例面板 */
  .pgroup{margin-bottom:9px;}
  .pgroup-h{font-size:11px;color:var(--faint);letter-spacing:.04em;margin:0 0 5px;}
  .pchips{display:flex;flex-wrap:wrap;gap:5px;}
  .pchip{
    font-size:12px;color:var(--accent2);background:#f1f6fb;border:1px solid #d9e6f2;
    border-radius:6px;padding:4px 9px;cursor:pointer;line-height:1.4;
  }
  .pchip:hover{background:#e6f0f9;border-color:#b9d4e8;}
  .pchip.gen{background:#fdf6ec;border-color:#eedcbe;color:#8a5a12;}
  .pchip.gen:hover{background:#fbf0de;}
  /* 分段一览（结果卡） */
  table.reachsum{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
  table.reachsum th{
    font-weight:500;color:var(--faint);font-size:11px;text-align:left;padding:3px 5px;
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.reachsum td{padding:4px 5px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;}
  table.reachsum td.mild{color:var(--sub);font-weight:600;}
  table.reachsum td.steep{color:var(--sup);font-weight:600;}
  table.reachsum td.other{color:var(--faint);}
  .hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.5;}
  .hint.warn{color:var(--warn);}
  .hint.err{color:var(--err);}
  .hint.ok{color:var(--ok);}

  /* legal */
  #legal{display:none;margin:0 12px 10px;border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.6;border-left:3px solid;}
  #legal ul{margin:3px 0 0;padding-left:16px;}

  /* charts */
  .chartbox{position:relative;}
  canvas{display:block;width:100%;height:100%;}
  #profileWrap{height:352px;}
  #sectionWrap{height:236px;}
  .legend{
    display:flex;flex-wrap:wrap;gap:14px;padding:8px 13px 10px;font-size:11.5px;color:var(--muted);
    border-top:1px solid var(--line2);
  }
  .legend i{display:inline-block;width:16px;height:0;border-top-width:2.4px;border-top-style:solid;margin-right:5px;vertical-align:middle;}
  .legend .dash i{border-top-style:dashed;border-top-width:1.6px;}
  .tip{
    position:absolute;pointer-events:none;background:rgba(22,32,43,.93);color:#fff;font-size:11.5px;
    padding:6px 9px;border-radius:6px;line-height:1.55;white-space:nowrap;transform:translate(-50%,-115%);
    opacity:0;transition:opacity .1s;z-index:20;
  }
  .tip.on{opacity:1;}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}

  /* result */
  .badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:11px;}
  .badge{
    font-size:13px;font-weight:600;padding:2px 9px;border-radius:5px;letter-spacing:.02em;
    background:#eef3f8;color:var(--accent);border:1px solid #d7e4ef;
  }
  .badge.sub{background:#eaf2fa;color:var(--sub);border-color:#cfe0f0;}
  .badge.sup{background:#fbf0e4;color:var(--sup);border-color:#f0dcc2;}
  .badge.junc{background:#fdeef0;color:var(--crit);border-color:#f2ccd2;}
  .arrow{color:#c3ccd5;font-size:12px;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;}
  .kv div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line2);}
  .kv span:first-child{color:var(--faint);}
  .kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600;}
  details.mech{margin-top:12px;border-top:1px solid var(--line2);padding-top:10px;}
  details.mech summary{
    cursor:pointer;font-size:12.5px;color:var(--accent2);list-style:none;outline:none;
    display:flex;align-items:center;gap:6px;
  }
  details.mech summary::-webkit-details-marker{display:none;}
  details.mech summary::before{content:"▸";font-size:11px;transition:transform .15s;}
  details.mech[open] summary::before{transform:rotate(90deg);}
  ol.reasons{margin:9px 0 0;padding-left:20px;font-size:12.3px;color:var(--muted);line-height:1.75;}
  ol.reasons li{margin-bottom:2px;}
  .wlist{margin-top:9px;display:flex;flex-direction:column;gap:5px;}
  .witem{font-size:12px;color:var(--warn);background:#fdf7ec;border-left:2px solid var(--warn);padding:5px 9px;border-radius:0 4px 4px 0;}

  table.props{width:100%;border-collapse:collapse;font-size:12.2px;margin-top:8px;}
  table.props td{padding:4px 6px;border-bottom:1px solid var(--line2);}
  table.props td:nth-child(odd){color:var(--faint);}
  table.props td:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}

  .hist{max-height:150px;overflow-y:auto;padding:6px 8px;}
  .hitem{
    display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-bottom:1px solid var(--line2);
    font-size:12.3px;cursor:pointer;border-radius:4px;
  }
  .hitem:hover{background:#f7fafd;}
  .hitem .t{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .hitem .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty{font-size:12px;color:var(--faint);padding:6px 2px;}

  @media(max-width:1180px){
    .layout{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <b>基于AI交互的水面线展示系统</b>
    <span>明渠非均匀流十二型水面曲线的自然语言计算与可视化</span>
  </div>
  <div class="grow"></div>
  <div class="seg" id="modeSeg">
    <button data-mode="teaching" class="on">教学模式 α=1.00</button>
    <button data-mode="engineering">工程模式 α=1.05</button>
  </div>
  <span class="pill" id="aiStatus"><i class="dot off"></i>检测中…</span>
</header>

<div class="layout">
  <!-- ================= 左栏 ================= -->
  <aside class="left">

    <section class="card">
      <div class="card-h">对话交互 <span class="tag">自然语言 → 参数 → 计算</span></div>
      <div class="chat-body" id="chatBody"></div>
      <div class="chat-resizer" id="chatResizer" title="上下拖动可调整对话区高度（会记住）"></div>
      <div id="legal"></div>
      <div class="chips" id="chips"></div>
      <div class="chat-ctx" id="chatCtx" style="display:none"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="例如：矩形渠 底宽5米 糙率0.015 坡度千分之一 流量10个方 水深2米">
        <button class="primary" id="sendBtn">发送</button>
        <button class="ghost" id="resetBtn" title="清空已记录参数">清空</button>
      </div>
    </section>

    <section class="card">
      <div class="card-h">示例算例
        <div class="seg" id="presetSeg" style="margin-left:auto;">
          <button data-sec="rectangular" class="on">矩形</button>
          <button data-sec="trapezoidal">梯形</button>
        </div>
      </div>
      <div class="card-b" id="presetPanel" style="max-height:340px;overflow:auto;">
        <div class="empty">载入中…</div>
      </div>
    </section>

    <section class="card">
      <div class="card-h">参数表单
        <span class="syncbadge" id="syncBadge"></span>
        <span class="tag">可手改，改后需重新计算</span>
      </div>
      <div class="card-b">
        <div class="grid3" style="margin-bottom:10px;">
          <div class="field"><label>流量 Q (m³/s)</label><input id="fQ" type="number" step="0.1" value="10"></div>
          <div class="field"><label>重力加速度 g</label><input id="fg" type="number" step="0.01" value="9.81" disabled></div>
          <div class="field"><label>α / β（工程模式可改）</label>
            <div style="display:flex;gap:6px;">
              <input id="fAlpha" type="number" step="0.01" value="1.00" title="动能修正系数 α" style="width:50%">
              <input id="fBeta" type="number" step="0.01" value="1.00" title="动量修正系数 β" style="width:50%">
            </div>
          </div>
        </div>

        <div class="reachbox">
          <div class="reachbox-h">渠段<span class="sub">段内棱柱体，段间折线变坡</span></div>
          <table class="reach" id="reachTable"></table>
          <div id="reachSummary" class="reachsum-form"></div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="ghost" id="addReach">＋ 增加渠段</button>
            <button class="ghost" id="delReach">− 删除末段</button>
          </div>
        </div>

        <div class="grid2" style="margin-top:11px;">
          <div class="field">
            <label>渠首条件</label>
            <select id="fUpType">
              <option value="none">未给定（自动假设）</option>
              <option value="given_h">给定水深</option>
            </select>
          </div>
          <div class="field"><label>渠首水深 (m)</label><input id="fUpH" type="number" step="0.01" placeholder="—"></div>
        </div>
        <div class="grid2" style="margin-top:9px;">
          <div class="field">
            <label>渠末条件</label>
            <select id="fDownType">
              <option value="free_outfall">自由跌水</option>
              <option value="given_h">给定水深</option>
              <option value="given_zw">给定水位</option>
              <option value="normal_depth">正常水深</option>
            </select>
          </div>
          <div class="field"><label>渠末水深 / 水位 (m)</label><input id="fDownH" type="number" step="0.01" placeholder="—"></div>
        </div>

        <div class="grid2" style="margin-top:9px;">
          <div class="field"><label>跃长公式</label>
            <select id="fJump">
              <option value="wu">吴持恭 L=6.9(h₂−h₁)</option>
              <option value="elevatorski">欧勒弗托斯基</option>
              <option value="chen">陈椿庭</option>
            </select>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="primary" id="calcBtn" style="flex:1;">计 算</button>
          <button class="ghost" id="demoBtn" title="恢复默认的两段变坡示例">载入示例</button>
          <button class="ghost" id="csvBtn">导出 CSV</button>
        </div>
        <div class="hint" id="formHint">参数已同步。</div>
      </div>
    </section>

    <section class="card">
      <div class="card-h">历史记录 <span class="tag">点击回放</span></div>
      <div class="hist" id="histBox"><div class="empty">暂无记录。</div></div>
    </section>

  </aside>

  <!-- ================= 右栏 ================= -->
  <section class="right">

    <div class="card">
      <div class="card-h">纵剖面图
      <div class="viewctl">
        <span class="tag" id="profileTag">点击图中任意位置查看横断面</span>
        <span class="xgo">x = <input id="xInput" type="number" step="1" placeholder="100"> m</span>
        <button class="zoomb" id="zoomOut" title="缩小">−</button>
        <button class="zoomb" id="zoomIn" title="放大">＋</button>
        <button class="zoomb" id="zoomReset" title="复位（双击图也可）">⤢</button>
      </div>
    </div>
      <div class="chartbox" id="profileWrap"><canvas id="profile"></canvas><div class="tip" id="profileTip"></div></div>
      <div class="legend">
        <span><i style="border-color:#2e6da4"></i>缓流段</span>
        <span><i style="border-color:#c9741f"></i>急流段</span>
        <span class="dash"><i style="border-color:#7d8b99"></i>正常水深线 h₀</span>
        <span class="dash"><i style="border-color:#b23c4a"></i>临界水深线 h_c</span>
        <span class="dash"><i style="border-color:#8b98a6"></i>渠底线</span>
      </div>
    </div>

    <div class="row2">
      <div class="card">
        <div class="card-h">横断面图 <span class="tag" id="sectionTag">未选择位置</span></div>
        <div class="chartbox" id="sectionWrap"><canvas id="section"></canvas></div>
        <div class="card-b" style="padding-top:8px;">
          <table class="props" id="propsTable"></table>
        </div>
      </div>

      <div class="card">
        <div class="card-h">计算结果 <span class="tag" id="statusTag"></span></div>
        <div class="card-b">
          <div class="badges" id="badges"><span style="color:#8b98a6;font-size:12.5px">尚未计算</span></div>
          <div id="reachSum"></div>
          <div class="kv" id="kvBox"></div>
          <div class="wlist" id="warnBox"></div>
          <details class="mech" id="mechBox">
            <summary>力学依据（判别过程）</summary>
            <ol class="reasons" id="reasonList"></ol>
          </details>
        </div>
      </div>
    </div>

  </section>
</div>

<script>
/* ============================================================
   前端只做三件事：收集参数、发请求、画结果对象。
   所有水力数值来自 gvf_core（服务端 Python），页面不计算。
   ============================================================ */
const $ = s => document.querySelector(s);
const f2 = (v,d) => (v==null||isNaN(v)) ? "—" : Number(v).toFixed(d==null?3:d);
const SLOPE_CN = {mild:"缓坡", steep:"陡坡", critical:"临界坡", horizontal:"平坡", adverse:"负坡"};
const REGIME_CN = {subcritical:"缓流", supercritical:"急流", critical:"临界"};

const state = {
  form: {Q:10, mode:"teaching", alpha:1.0, beta:1.0, jump:"wu",
         /* 默认两段、坡度不同：缓坡 → 陡坡，坡折处出临界，正好演示分段衔接 */
         reaches:[{L:300,i:0.001,b:5,m:0,n:0.015},
                  {L:300,i:0.020,b:5,m:0,n:0.015}],
         up:"none", upH:null, down:"free_outfall", downH:null},
  result: null, slots: {}, selectedX:null, hover:null, legal:null, classKey:null, view:null, presetSec:"rectangular"
};

/* ---------------- 工具 ---------------- */
/* ---------------- 出题：题干/答案来自内核，解析由模型写 ---------------- */
function renderQuiz(items){
  if(!items || !items.length) return;
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const box = document.createElement("div");
  box.className = "msg ai quiz";
  box.innerHTML = items.map((it, i) =>
    '<div class="qitem"><div class="qtitle">' + (i+1) + '. ' + esc(it.q) + '</div>' +
    '<details><summary>显示答案与解析</summary>' +
      '<div class="qans"><b>参考答案：</b>' + esc(it.a) + '</div>' +
      (it.why ? '<div class="qwhy"><b>解析：</b>' + esc(it.why) + '</div>' : '') +
    '</details></div>').join("");
  const body = $("#chatBody");
  body.appendChild(box);
  body.scrollTop = 1e9;
}

function bubble(text, who, whoName){
  const d = document.createElement("div");
  d.className = "msg " + who;
  if(whoName) d.innerHTML = '<span class="who">'+whoName+'</span>';
  d.appendChild(document.createTextNode(text));
  $("#chatBody").appendChild(d);
  $("#chatBody").scrollTop = 1e9;
  return d;
}
function sysNote(text){ const d=bubble(text,"sys"); return d; }

/* ---------------- 表单 ---------------- */
const SLOPE_TAG = {mild:"缓坡", steep:"陡坡", critical:"临界坡", horizontal:"平坡", adverse:"负坡"};

function reachesRange(){
  let x = 0;
  return state.form.reaches.map(r=>{
    const a = x, b = x + Number(r.L||0);
    x = b;
    return [a,b];
  });
}
/* 计算后才有：该段坡型 / 临界底坡 / 曲线型号 */
function slopeInfo(i){
  const R = state.result;
  if(!R || !R.reaches || R.reaches.length !== state.form.reaches.length) return null;
  const r = R.reaches[i];
  if(!r) return null;
  const curve = (R.segments||[]).filter(s=>s.reach_index===r.index)
                                 .map(s=>s.curve_type).filter((v,k,a)=>a.indexOf(v)===k).join("/");
  return {cn: SLOPE_TAG[r.slope_class]||r.slope_class, ic: r.ic, h0: r.h0, hc: r.hc, curve};
}

function renderReaches(){
  const tb = $("#reachTable");
  const rows = state.form.reaches;
  let html = "<thead><tr><th>段</th><th>长度 L</th><th>底坡 i</th><th>底宽 b</th><th>边坡 m</th><th>糙率 n</th></tr></thead><tbody>";
  rows.forEach((r,i)=>{
    html += "<tr><td class='segno'><span class='segdot s"+(i%4)+"'></span>"+(i+1)+"</td>"+
      ["L","i","b","m","n"].map(k=>
        '<td><input data-i="'+i+'" data-k="'+k+'" type="number" step="'+
        (k==="i"?"0.0001":k==="n"?"0.001":"0.1")+'" value="'+r[k]+'"></td>'
      ).join("")+"</tr>";
  });
  html += "</tbody>";
  tb.innerHTML = html;
  tb.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const i = +inp.dataset.i, k = inp.dataset.k;
      const v = parseFloat(inp.value);
      state.form.reaches[i][k] = isNaN(v) ? 0 : v;
      renderReachSummary();
      markDirty();
    });
  });
  renderReachSummary();
}

/* 分段一览：里程区间 + 坡型 + 曲线，直接回答「哪一段在发生什么」 */
function renderReachSummary(){
  const box = $("#reachSummary");
  if(!box) return;
  const ranges = reachesRange();
  box.innerHTML = state.form.reaches.map((r,i)=>{
    const [a,b] = ranges[i];
    const si = slopeInfo(i);
    const dot = "<span class='segdot s"+(i%4)+"'></span>";
    let tail;
    if(si){
      const cmp = (Math.abs(r.i) < 1e-12) ? "平坡"
        : (Math.abs(si.ic) < 1e-12 ? "—" : (Math.abs(r.i) > Math.abs(si.ic) ? "i > i_c" : "i < i_c"));
      tail = "<b class='"+(si.cn==="缓坡"?"t-mild":si.cn==="陡坡"?"t-steep":"t-other")+"'>"+si.cn+"</b>"+
             " <span class='sub'>i="+Number(r.i).toPrecision(3)+" · i_c="+Number(si.ic).toPrecision(3)+
             (cmp!=="—"?" · "+cmp:"")+"</span>"+
             (si.curve?" <span class='curvepill'>"+si.curve+"</span>":"");
    }else{
      tail = "<span class='sub'>待计算</span>";
    }
    return "<div class='rline'>"+dot+"<span class='rname'>第"+(i+1)+"段</span>"+
           "<span class='rrange'>"+f2(a,0)+"–"+f2(b,0)+" m</span>"+tail+"</div>";
  }).join("");
}

function syncForm(src){
  const before = JSON.stringify(state.form);
  const f = state.form;
  if(src) applySlotsToForm(src);
  $("#fQ").value = f.Q;
  $("#fAlpha").value = Number(f.alpha).toFixed(2);
  $("#fBeta").value = Number(f.beta).toFixed(2);
  const eng = (f.mode === "engineering");
  $("#fAlpha").disabled = !eng;
  $("#fBeta").disabled = !eng;
  $("#fAlpha").title = eng ? "动能修正系数 α（可改，1.00~1.30）" : "教学模式固定 1.00";
  $("#fBeta").title = eng ? "动量修正系数 β（可改，1.00~1.30）" : "教学模式固定 1.00";
  $("#fUpType").value = f.up || "none";
  $("#fUpH").value = f.upH == null ? "" : f.upH;
  $("#fUpH").disabled = (f.up !== "given_h");
  $("#fDownType").value = f.down || "free_outfall";
  $("#fDownH").value = f.downH == null ? "" : f.downH;
  $("#fDownH").disabled = (f.down === "free_outfall" || f.down === "normal_depth");
  renderReaches();
  flashDiff(before);
}

/* 对话改了参数 → 表单对应控件闪一下，形成「你说的话已经记进表里」的反馈 */
function flashDiff(beforeJson){
  let before;
  try{ before = JSON.parse(beforeJson); }catch(e){ return; }
  const after = state.form;
  const flash = el => { if(!el) return; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); };
  if(before.Q !== after.Q) flash($("#fQ"));
  if(before.down !== after.down) flash($("#fDownType"));
  if(before.downH !== after.downH) flash($("#fDownH"));
  if(before.up !== after.up) flash($("#fUpType"));
  if(before.upH !== after.upH) flash($("#fUpH"));
  const rb = before.reaches||[], ra = after.reaches||[];
  ra.forEach((r,i)=>{
    const o = rb[i]||{};
    ["L","i","b","m","n"].forEach(k=>{
      if(String(o[k]) !== String(r[k])){
        flash(document.querySelector('#reachTable input[data-i="'+i+'"][data-k="'+k+'"]'));
      }
    });
  });
}

function applySlotsToForm(s){
  const f = state.form;
  if(s.Q != null) f.Q = Number(s.Q);
  if(s.q != null) f.Q = Number(s.q);
  if(s.mode) f.mode = s.mode;
  if(s.mode === "engineering"){ f.alpha = 1.05; f.beta = 1.05; }
  else if(s.mode){ f.alpha = 1.0; f.beta = 1.0; }
  if(s.downstream) f.down = s.downstream;
  if(s.downstream === "given_h" && s.h0 != null) f.downH = Number(s.h0);
  if(s.downstream === "given_zw" && s.zw != null) f.downH = Number(s.zw);
  if(s.upstream){ f.up = s.upstream; if(s.up_h != null) f.upH = Number(s.up_h); }
  if(s.jump_len_formula) f.jump = s.jump_len_formula;
  if(Array.isArray(s.reaches) && s.reaches.length){
    f.reaches = s.reaches.map(r=>({L:+r.L, i:+r.i, b:+r.b, m:+(r.m||0), n:+r.n}));
  } else if(s.b != null && s.n != null && s.i != null && s.L != null){
    // 对话给的是单段参数：整条渠按一段处理（多段由表单维护）
    f.reaches = [{L:+s.L, i:+s.i, b:+s.b, m:+(s.m||0), n:+s.n}];
  }
}
/* 对话 → 表单 的可见反馈：表单标题旁亮一个「已同步 N 项」 */
let _syncTimer = null;
function flashSyncBadge(n){
  const b = $("#syncBadge");
  if(!b) return;
  b.textContent = "对话已同步 " + n + " 项";
  b.classList.add("on");
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(()=>b.classList.remove("on"), 4000);
}

function markDirty(){
  $("#formHint").textContent = "参数已修改，点击「计算」更新结果。";
  $("#formHint").className = "hint warn";
}
function formParams(){
  const f = state.form;
  return {
    Q: Number(f.Q), mode: f.mode, jump_len_formula: f.jump,
      alpha: (f.mode === "engineering") ? Number(f.alpha) : 1.0,
      beta: (f.mode === "engineering") ? Number(f.beta) : 1.0,
    reaches: f.reaches.map(r=>({L:+r.L, i:+r.i, b:+r.b, m:+(r.m||0), n:+r.n})),
    downstream: f.down,
    h0: (f.down === "given_h") ? (f.downH==null?null:+f.downH) : null,
    zw: (f.down === "given_zw") ? (f.downH==null?null:+f.downH) : null,
    upstream: f.up,
    up_h: (f.up === "given_h") ? (f.upH==null?null:+f.upH) : null
  };
}

/* ---------------- 画布 ---------------- */
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  const w = Math.max(rect.width, 10), h = Math.max(rect.height, 10);
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}
function niceTicks(min,max,n){
  const span = max-min;
  if(!(span>0)) return [min];
  const raw = span/n, mag = Math.pow(10,Math.floor(Math.log10(raw)));
  const norm = raw/mag;
  const step = norm<1.5?mag:norm<3?2*mag:norm<7?5*mag:10*mag;
  const out=[];
  for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step) out.push(+v.toFixed(10));
  return out;
}
function reachAt(x){
  const rs = state.result.reaches;
  for(const r of rs) if(x>=r.x_start-1e-6 && x<=r.x_end+1e-6) return r;
  return rs[rs.length-1];
}
function zbAt(x){
  const r = reachAt(x);
  return r.z_b_start - r.i*(x - r.x_start);
}
function segAt(x){
  const R = state.result;
  for(const s of R.segments){
    const lo = s.x[0], hi = s.x[s.x.length-1];
    if(x>=Math.min(lo,hi)-1e-6 && x<=Math.max(lo,hi)+1e-6) return {s, lo:Math.min(lo,hi), hi:Math.max(lo,hi)};
  }
  return null;
}
function waterAt(x){
  const hit = segAt(x);
  if(!hit) return null;
  return interpSeg(hit.s, x, "h");
}
function interpSeg(s, x, key){
  const arr = s[key] || [];
  for(let i=1;i<s.x.length;i++){
    if((x>=s.x[i-1] && x<=s.x[i]) || (x<=s.x[i-1] && x>=s.x[i])){
      const t = (x-s.x[i-1])/((s.x[i]-s.x[i-1])||1);
      return arr[i-1]+t*(arr[i]-arr[i-1]);
    }
  }
  return arr.length ? arr[0] : null;
}
function frAt(x){
  const hit = segAt(x);
  return hit ? interpSeg(hit.s, x, "Fr") : null;
}

/* ---------------- 纵剖面 ---------------- */
function drawProfile(){
  const cv = $("#profile");
  const {ctx, w, h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const R = state.result;
  if(!R){
    ctx.fillStyle="#8b98a6"; ctx.font="13px sans-serif"; ctx.textAlign="center";
    ctx.fillText("点击「计算」或说一句话开始", w/2, h/2); return;
  }
  const pad = {l:62,r:18,t:16,b:36};
  const rs = R.reaches;
  const fullX0 = rs[0].x_start, fullXL = rs[rs.length-1].x_end;
  /* 视窗：null 表示整条渠；放大后只画 {x0,x1} 区间 */
  let x0 = fullX0, xL = fullXL;
  if(state.view && state.view.x1 > state.view.x0){
    x0 = Math.max(fullX0, state.view.x0);
    xL = Math.min(fullXL, state.view.x1);
    if(xL - x0 < 0.5){ x0 = fullX0; xL = fullXL; state.view = null; }
  }
  let yMin=Infinity, yMax=-Infinity;
  const inView = x => (x >= x0 - 1e-9 && x <= xL + 1e-9);
  for(const r of rs){
    if(r.x_end < x0 || r.x_start > xL) continue;
    yMin = Math.min(yMin, r.z_b_start, r.z_b_end);
    yMax = Math.max(yMax, r.z_b_start, r.z_b_end);
    if(r.h0!=null) yMax = Math.max(yMax, r.z_b_start+r.h0, r.z_b_end+r.h0);
    yMax = Math.max(yMax, r.z_b_start+r.hc, r.z_b_end+r.hc);
  }
  for(const s of R.segments) for(let i=0;i<s.z_w.length;i++){
    if(!inView(s.x[i])) continue;
    yMax = Math.max(yMax, s.z_w[i]); yMin = Math.min(yMin, s.z_b[i]);
  }
  if(!isFinite(yMin) || !isFinite(yMax)){ yMin = 0; yMax = 1; }
  const spanY = Math.max(yMax-yMin, 0.5);
  yMin -= spanY*0.06; yMax += spanY*0.12;
  const X = x => pad.l + (x-x0)/((xL-x0)||1)*(w-pad.l-pad.r);
  const Y = z => h-pad.b - (z-yMin)/((yMax-yMin)||1)*(h-pad.t-pad.b);
  /* 放大后把绘制限制在绘图区内，避免曲线溢出到坐标轴外 */
  ctx.save();
  ctx.beginPath();
  ctx.rect(pad.l, pad.t-2, w-pad.l-pad.r, h-pad.t-pad.b+4);
  ctx.clip();

  /* 网格 */
  ctx.strokeStyle="#eef1f5"; ctx.lineWidth=1;
  ctx.font="11px -apple-system,Segoe UI,sans-serif"; ctx.textBaseline="middle";
  niceTicks(yMin,yMax,5).forEach(z=>{
    const y=Y(z);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillStyle="#8b98a6"; ctx.textAlign="right"; ctx.fillText(z.toFixed(1), pad.l-8, y);
  });
  niceTicks(x0,xL,6).forEach(x=>{
    const px=X(x);
    ctx.beginPath(); ctx.moveTo(px,pad.t); ctx.lineTo(px,h-pad.b); ctx.stroke();
    ctx.fillStyle="#8b98a6"; ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillText(String(Math.round(x)), px, h-pad.b+7);
  });
  ctx.fillStyle="#5b6b7b"; ctx.font="12px -apple-system,Segoe UI,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.fillText("里程 x (m)", (pad.l+w-pad.r)/2, h-14);
  ctx.save(); ctx.translate(14,(pad.t+h-pad.b)/2); ctx.rotate(-Math.PI/2);
  ctx.fillText("高程 z (m)",0,0); ctx.restore();

  /* 分段底色：让「不同渠段」在图上直接分得开 */
  rs.forEach((r,k)=>{
    const x1=X(r.x_start), x2=X(r.x_end);
    ctx.fillStyle = (k%2) ? "rgba(120,140,160,.055)" : "rgba(120,140,160,.015)";
    ctx.fillRect(x1, pad.t, Math.max(x2-x1,0), h-pad.t-pad.b);
  });

  /* 教学模式：Ⅱ区淡蓝带 */
  if(state.form.mode === "teaching"){
    ctx.fillStyle = "rgba(46,109,164,0.055)";
    for(const r of rs){
      if(r.h0==null) continue;
      const x1=X(r.x_start), x2=X(r.x_end);
      ctx.beginPath();
      ctx.moveTo(x1, Y(r.z_b_start+r.h0));
      ctx.lineTo(x2, Y(r.z_b_end+r.h0));
      ctx.lineTo(x2, Y(r.z_b_end+r.hc));
      ctx.lineTo(x1, Y(r.z_b_start+r.hc));
      ctx.closePath(); ctx.fill();
    }
  }

  /* 渠底以下填土色 */
  ctx.beginPath();
  ctx.moveTo(X(rs[0].x_start), Y(rs[0].z_b_start));
  for(const r of rs) ctx.lineTo(X(r.x_end), Y(r.z_b_end));
  ctx.lineTo(X(xL), h-pad.b); ctx.lineTo(X(x0), h-pad.b); ctx.closePath();
  ctx.fillStyle="#f2f4f6"; ctx.fill();

  /* 渠底线 */
  ctx.beginPath();
  ctx.moveTo(X(rs[0].x_start), Y(rs[0].z_b_start));
  for(const r of rs) ctx.lineTo(X(r.x_end), Y(r.z_b_end));
  ctx.strokeStyle="#6b7a88"; ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.stroke();

  /* h0 / hc 逐段虚线 */
  const stepLine=(key,color)=>{
    ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle=color; ctx.lineWidth=1.6;
    for(const r of rs){
      const v=r[key]; if(v==null) continue;
      ctx.beginPath();
      ctx.moveTo(X(r.x_start), Y(r.z_b_start+v));
      ctx.lineTo(X(r.x_end), Y(r.z_b_end+v));
      ctx.stroke();
    }
    ctx.restore();
  };
  stepLine("h0","#7d8b99");
  stepLine("hc","#b23c4a");

  /* N-N / C-C 标注（教材图样式：两端各标一处） */
  const tagLine=(key,color,text)=>{
    const f=rs[0], l=rs[rs.length-1];
    ctx.font="600 11px -apple-system,Segoe UI,sans-serif";
    ctx.textBaseline="middle";
    if(f[key]!=null){
      ctx.fillStyle=color; ctx.textAlign="left";
      ctx.fillText(text, X(f.x_start)+6, Y(f.z_b_start+f[key]));
    }
    if(l[key]!=null){
      ctx.fillStyle=color; ctx.textAlign="right";
      ctx.fillText(text, X(l.x_end)-6, Y(l.z_b_end+l[key]));
    }
  };
  tagLine("h0","#5b6b7b","N-N");
  tagLine("hc","#b23c4a","C-C");

  /* 五类综合算例：照教材图在三条分支上标型号（M1/M2/M3 等） */
  if(state.classKey && R.reaches.length){
    const cls = state.classKey.replace("class_","").charAt(0);
    const r0 = R.reaches[0];
    const h0 = r0.h0, hc = r0.hc;
    const zb = r0.z_b_start;
    const xm = X(r0.x_start + (r0.x_end - r0.x_start) * 0.72);
    ctx.font="600 13px -apple-system,Segoe UI,sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.globalAlpha = 0.55;
    if(h0!=null){
      ctx.fillStyle="#5b6b7b";
      ctx.fillText(cls+"1", xm, Y(zb + h0*1.45));
      if(hc<h0){ ctx.fillStyle="#2e6da4"; ctx.fillText(cls+"2", xm, Y(zb + (h0+hc)/2)); }
    }
    if(hc!=null){
      ctx.fillStyle="#b23c4a";
      ctx.fillText(cls+"3", xm, Y(zb + hc*0.45));
    }
    ctx.globalAlpha = 1;
  }

  /* 水面线 */
  for(const s of R.segments){
    ctx.beginPath();
    for(let i=0;i<s.x.length;i++){
      const px=X(s.x[i]), py=Y(s.z_w[i]);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.strokeStyle = s.regime==="supercritical" ? "#c9741f" : "#2e6da4";
    ctx.lineWidth=2.6; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.stroke();
    const mi = Math.floor(s.x.length*0.5);
    if(s.x.length>4){
      ctx.fillStyle = s.regime==="supercritical" ? "#c9741f" : "#2e6da4";
      ctx.font="600 11.5px -apple-system,Segoe UI,sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="bottom";
      ctx.fillText(s.curve_type, X(s.x[mi]), Y(s.z_w[mi])-6);
    }
  }

  /* 分段标签：色点 + 第N段 + 坡型 + 该段曲线型号（强调"一段一条线"）*/
  const SEGC = ["#2e6da4","#c9741f","#2f7d54","#7a3b0e"];
  rs.forEach((r,k)=>{
    const segs = R.segments.filter(s=>s.reach_index===r.index)
                           .map(s=>s.curve_type)
                           .filter((v,i,a)=>a.indexOf(v)===i).join("/");
    const txt = "第"+(k+1)+"段 · "+(SLOPE_TAG[r.slope_class]||"")+(segs?(" · "+segs):"");
    ctx.font="600 11.5px -apple-system,Segoe UI,sans-serif";
    const tw = ctx.measureText(txt).width;
    const cx = X((r.x_start+r.x_end)/2);
    const left = Math.min(Math.max(cx - tw/2 - 1, pad.l+2), w - pad.r - tw - 2);
    ctx.fillStyle = SEGC[k%4];
    ctx.fillRect(left-11, pad.t+6, 7, 7);
    ctx.textAlign="left"; ctx.textBaseline="top";
    ctx.fillText(txt, left, pad.t+3);
  });

  /* 坡折节点：竖线 + 型序列（M2 ｜ 临界 ｜ S2）*/
  for(let k=1;k<rs.length;k++){
    const px = X(rs[k].x_start);
    ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle="#c3ccd5"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px, pad.t+20); ctx.lineTo(px, h-pad.b); ctx.stroke(); ctx.restore();
    const prev = R.segments.filter(s=>s.reach_index===k-1).map(s=>s.curve_type).slice(-1)[0] || "";
    const next = R.segments.filter(s=>s.reach_index===k).map(s=>s.curve_type)[0] || "";
    const tr = R.transitions.find(t=>Math.abs(t.x - rs[k].x_start) < 1e-3);
    const mid = tr ? ({critical:"临界", jump:"水跃", jump_submerged:"淹没水跃",
                       jump_washed:"水跃出渠", outfall:"水跌"}[tr.kind] || "衔接") : "";
    const label = [prev, mid, next].filter(Boolean).join(" ｜ ");
    if(label){
      ctx.font="600 11px -apple-system,Segoe UI,sans-serif";
      ctx.fillStyle="#7d8b99"; ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.fillText(label, Math.min(Math.max(px, pad.l+60), w-pad.r-60), pad.t+22);
    }
  }

  /* 衔接事件 */
  for(const t of R.transitions){
    const zb = zbAt(t.x);
    if(t.kind==="jump" || t.kind==="jump_submerged" || t.kind==="jump_washed"){
      const z1 = zb+(t.data.h1||0), z2 = zb+(t.data.h2||0);
      const y1=Y(z1), y2=Y(z2), px=X(t.x);
      ctx.save(); ctx.setLineDash([4,3]); ctx.strokeStyle="#b23c4a"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(px,y1); ctx.lineTo(px,y2); ctx.stroke(); ctx.restore();
      const yTop=Math.min(y1,y2), yBot=Math.max(y1,y2);
      const nz=Math.max(3, Math.round((yBot-yTop)/7));
      ctx.strokeStyle="#b23c4a"; ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(px-6,yBot);
      for(let i=0;i<=nz;i++){
        const yy=yBot+(yTop-yBot)*i/nz;
        ctx.lineTo(px+(i%2?6:-6), yy);
      }
      ctx.stroke();
      ctx.fillStyle="#b23c4a"; ctx.font="600 11.5px -apple-system,Segoe UI,sans-serif";
      ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.fillText(t.kind==="jump"?"水跃 h₁→h₂":(t.kind==="jump_submerged"?"淹没水跃":"水跃出渠"), px+10, (yTop+yBot)/2);
    }
    if(t.kind==="outfall"){
      ctx.save(); ctx.setLineDash([4,3]); ctx.strokeStyle="#5b6b7b"; ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(X(t.x), Y(zb+(t.data.hc||0))); ctx.lineTo(X(t.x), Y(zb)); ctx.stroke();
      ctx.restore();
      ctx.fillStyle="#5b6b7b"; ctx.font="600 11px -apple-system,Segoe UI,sans-serif";
      ctx.textAlign="right"; ctx.textBaseline="middle";
      ctx.fillText("水跌", X(t.x)-6, Y(zb+(t.data.hc||0)*0.5));
    }
    if(t.kind==="critical"){
      const zc = zb+(t.data.hc||0);
      ctx.beginPath(); ctx.arc(X(t.x), Y(zc), 4, 0, Math.PI*2);
      ctx.fillStyle="#b23c4a"; ctx.fill();
      ctx.fillStyle="#b23c4a"; ctx.font="600 11px -apple-system,Segoe UI,sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.fillText("临界", X(t.x), Y(zc)+7);
    }
  }

  /* 选中竖线 */
  if(state.selectedX!=null){
    const px=X(state.selectedX);
    ctx.save(); ctx.setLineDash([2,3]); ctx.strokeStyle="#1f4e79"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(px,pad.t); ctx.lineTo(px,h-pad.b); ctx.stroke(); ctx.restore();
    const hh=waterAt(state.selectedX);
    if(hh!=null){
      ctx.beginPath(); ctx.arc(px, Y(zbAt(state.selectedX)+hh), 4, 0, Math.PI*2);
      ctx.fillStyle="#1f4e79"; ctx.fill();
    }
  }
  /* 悬停十字 */
  if(state.hover!=null){
    ctx.save(); ctx.strokeStyle="rgba(31,78,121,.35)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(state.hover),pad.t); ctx.lineTo(X(state.hover),h-pad.b); ctx.stroke();
    ctx.restore();
  }

  /* 纵横比 */
  ctx.restore();
  const vScale=(h-pad.t-pad.b)/Math.max(yMax-yMin,1e-6);
  const hScale=(w-pad.l-pad.r)/Math.max(xL-x0,1);
  ctx.fillStyle="#a9b4bf"; ctx.font="11px -apple-system,Segoe UI,sans-serif";
  ctx.textAlign="right"; ctx.textBaseline="bottom";
  ctx.fillText("竖向放大 "+(vScale/hScale).toFixed(0)+" 倍", w-pad.r, h-pad.b-4);

  cv._geo = {X, Y, x0, xL, pad, w, h};
}

/* ---------------- 横断面 ---------------- */
async function drawSection(){
  const cv = $("#section");
  const {ctx, w, h:H} = setupCanvas(cv);
  ctx.clearRect(0,0,w,H);
  if(state.selectedX==null){
    ctx.fillStyle="#8b98a6"; ctx.font="13px sans-serif"; ctx.textAlign="center";
    ctx.fillText("点击纵剖面选取断面", w/2, H/2);
    $("#sectionTag").textContent="未选择位置"; $("#propsTable").innerHTML=""; return;
  }
  let d;
  try{
    d = await (await fetch('/api/section?x='+Number(state.selectedX).toFixed(3))).json();
  }catch(e){ return; }
  if(!d || !d.found){
    ctx.fillStyle="#8b98a6"; ctx.font="13px sans-serif"; ctx.textAlign="center";
    ctx.fillText("该里程没有结果", w/2, H/2); return;
  }
  const r = state.result.reaches[d.reach_index] || state.result.reaches[0];
  const b = r.b, m = Math.max(r.m||0, 0);
  /* 视图高度：至少容得下水面、临界水深与正常水深 */
  const top = Math.max(d.h, r.hc, r.h0||0, 0.4)*1.30;
  const halfTop = b/2 + m*top;                 // 顶宽的一半（梯形会张开）
  const halfW = b/2 + m*d.h;                    // 水面半宽
  const span = Math.max(halfTop, b/2)*(1.0) + Math.max(top*0.10, 0.05);
  const pad = {l:56, r:64, t:26, b:34};
  const X = xx => pad.l + (xx+span)/(2*span)*(w-pad.l-pad.r);
  const Y = yy => H-pad.b - (yy/top)*(H-pad.t-pad.b);

  /* 地面线 */
  ctx.strokeStyle="#e2e7ec"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X(-span), Y(top)); ctx.lineTo(X(span), Y(top)); ctx.stroke();

  /* 渠身（梯形：底宽 b，两侧 1:m 边坡）*/
  ctx.beginPath();
  ctx.moveTo(X(-halfTop), Y(top));
  ctx.lineTo(X(-b/2), Y(0));
  ctx.lineTo(X(b/2), Y(0));
  ctx.lineTo(X(halfTop), Y(top));
  ctx.fillStyle="#f2f4f6"; ctx.fill();
  ctx.strokeStyle="#6b7a88"; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();

  /* 水体（同样是梯形，不能画成矩形）*/
  ctx.beginPath();
  ctx.moveTo(X(-b/2), Y(0));
  ctx.lineTo(X(b/2), Y(0));
  ctx.lineTo(X(halfW), Y(d.h));
  ctx.lineTo(X(-halfW), Y(d.h));
  ctx.closePath();
  const isSup = d.regime==="supercritical";
  ctx.fillStyle = isSup ? "rgba(201,116,31,.20)" : "rgba(46,109,164,.20)";
  ctx.fill();
  ctx.strokeStyle = isSup ? "#c9741f" : "#2e6da4";
  ctx.lineWidth=2; ctx.stroke();

  /* 水面线 */
  ctx.beginPath();
  ctx.moveTo(X(-halfW), Y(d.h)); ctx.lineTo(X(halfW), Y(d.h));
  ctx.strokeStyle = isSup ? "#c9741f" : "#2e6da4"; ctx.lineWidth=2.4; ctx.stroke();

  /* h0 / hc 参考线：梯形时该高程处的断面上口宽度随水位变化 */
  const halfAt = v => b/2 + m*v;
  const refLine=(v,color,label)=>{
    if(v==null || v>top) return;
    const y=Y(v), hw=halfAt(v);
    ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle=color; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(X(-hw),y); ctx.lineTo(X(hw),y); ctx.stroke();
    ctx.restore();
    ctx.fillStyle=color; ctx.font="10.5px -apple-system,Segoe UI,sans-serif";
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText(label+" "+v.toFixed(2), X(hw)+5, y);
  };
  refLine(r.h0, "#7d8b99", "h₀");
  refLine(r.hc, "#b23c4a", "h_c");

  /* 水深标注（左侧）*/
  const xd = X(-halfAt(top))-10;
  ctx.strokeStyle="#1f4e79"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(xd, Y(0)); ctx.lineTo(xd, Y(d.h)); ctx.stroke();
  [[Y(0),1],[Y(d.h),-1]].forEach(([yy,s])=>{
    ctx.beginPath(); ctx.moveTo(xd,yy); ctx.lineTo(xd-4,yy+6*s); ctx.lineTo(xd+4,yy+6*s);
    ctx.closePath(); ctx.fillStyle="#1f4e79"; ctx.fill();
  });
  ctx.save(); ctx.translate(xd-8,(Y(0)+Y(d.h))/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle="#1f4e79"; ctx.font="600 11px -apple-system,Segoe UI,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  ctx.fillText("h = "+d.h.toFixed(3)+" m",0,0); ctx.restore();

  /* 底宽 b（底部）*/
  const yb = Y(0)+12;
  ctx.strokeStyle="#6b7a88"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X(-b/2),yb); ctx.lineTo(X(b/2),yb); ctx.stroke();
  ctx.fillStyle="#6b7a88"; ctx.font="11px -apple-system,Segoe UI,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText("b = "+b.toFixed(2)+" m", X(0), yb+2);

  /* 水面宽 B */
  const yB = Y(d.h)-9;
  ctx.strokeStyle="#2e6da4"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X(-halfW),yB); ctx.lineTo(X(halfW),yB); ctx.stroke();
  ctx.fillStyle="#2e6da4"; ctx.font="11px -apple-system,Segoe UI,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  ctx.fillText("B = "+d.B.toFixed(2)+" m", X(0), yB-2);

  /* 坡度标注：梯形时沿左侧坡面标 m */
  if(m > 0){
    const xm = X(-halfAt(d.h*0.5)), ym = Y(d.h*0.5);
    ctx.fillStyle="#8b98a6"; ctx.font="11px -apple-system,Segoe UI,sans-serif";
    ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillText("m = "+m.toFixed(2), xm-8, ym);
  }

  /* 水跃区提示 */
  if(d.in_jump_zone){
    ctx.fillStyle="#b23c4a"; ctx.font="600 11.5px -apple-system,Segoe UI,sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillText("水跃区内水面不连续 h₁="+f2(d.jump_h1,2)+" m，h₂="+f2(d.jump_h2,2)+" m", X(0), 2);
  }

  /* 要素表 */
  const rows = [
    ["过水面积 A", d.A.toFixed(2)+" m²"], ["水面宽 B", d.B.toFixed(2)+" m"],
    ["湿周 P", d.P.toFixed(2)+" m"], ["水力半径 R", d.R.toFixed(3)+" m"],
    ["流速 v", d.v.toFixed(3)+" m/s"], ["弗劳德数 Fr", d.Fr.toFixed(3)],
    ["断面比能 E_s", d.Es.toFixed(3)+" m"], ["平均水深 h̄", d.hbar.toFixed(3)+" m"],
    ["形心水深 ȳ", d.ybar.toFixed(3)+" m"],
    ["渠底高程 z_b", d.z_b.toFixed(3)+" m"], ["水面高程 z_w", d.z_w.toFixed(3)+" m"]
  ];
  $("#propsTable").innerHTML = rows.map(x=>"<tr><td>"+x[0]+"</td><td>"+x[1]+"</td></tr>").join("");
  $("#sectionTag").textContent = "x = "+d.x.toFixed(1)+" m · 第"+(r.index+1)+"段"+
    (m>0?"（梯形 m="+m.toFixed(2)+"）":"（矩形）")+" · "+d.curve_type+" · "+REGIME_CN[d.regime];
}

/* ---------------- 结果卡 ---------------- */
function renderResult(){
  const R = state.result;
  if(!R){ return; }
  $("#statusTag").textContent = (R.status==="ok"?"计算完成":"无解") +
    " · "+R.segments.length+" 段曲线 / "+R.transitions.length+" 个衔接事件";

  /* 型序徽章 */
  const seq = (R.facts && R.facts.type_sequence) || [];
  const items = seq.map(it=>{
    let cls = "sub";
    if(it.kind==="junction") cls="junc";
    else{
      const seg = R.segments.find(s=>s.curve_type===it.label);
      cls = (seg && seg.regime==="supercritical") ? "sup" : "sub";
    }
    return {x:it.x_start, el:it.label, cls};
  });
  $("#badges").innerHTML = items.length
    ? items.map((it,i)=>'<span class="badge '+it.cls+'">'+it.el+'</span>'+
        (i<items.length-1?'<span class="arrow">→</span>':'')).join("")
    : '<span style="color:#8b98a6;font-size:12.5px">无曲线</span>';

  /* 关键数字 */
  const kn = (R.facts && R.facts.key_numbers) || {};
  const r0 = R.reaches[0];
  const kv = [
    ["流量 Q", f2(kn.Q,2)+" m³/s"],
    ["α / β", f2(R.params_echo ? R.params_echo.alpha : kn.alpha,2)+" / "+
             f2(R.params_echo ? R.params_echo.beta : kn.beta,2)],
    ["正常水深 h₀", r0.h0==null?"不存在":f2(r0.h0)+" m"],
    ["临界水深 h_c", f2(r0.hc)+" m"],
    ["临界底坡 i_c", f2(r0.ic,5)],
    ["最高水位", kn.max_zw==null?"—":f2(kn.max_zw)+" m"],
    ["最高水位位置", kn.max_zw_x==null?"—":f2(kn.max_zw_x,0)+" m"],
    ["最大水深", f2(kn.max_h)+" m"]
  ];
  const jump = R.transitions.find(t=>t.kind==="jump");
  if(jump){
    kv.push(["水跃位置", f2(jump.x,1)+" m"]);
    kv.push(["跃前/跃后水深", f2(jump.data.h1)+" / "+f2(jump.data.h2)+" m"]);
    kv.push(["跃前 Fr₁", f2(jump.data.Fr1,2)+"（"+(jump.data.jump_type_cn||"")+"）"]);
    kv.push(["跃长 L_j", f2(jump.data.L_j,2)+" m"]);
    kv.push(["消能系数 K_j", f2(jump.data.Kj,3)]);
  }
  const len99 = R.segments.map(s=>s.len_99).filter(v=>v!=null && isFinite(v));
  if(len99.length){
    kv.push(["回水/降水影响长度", f2(Math.max.apply(null,len99),1)+" m"]);
  }
  $("#kvBox").innerHTML = kv.map(x=>"<div><span>"+x[0]+"</span><span>"+x[1]+"</span></div>").join("");

  /* 分段一览：把「哪一段是哪种水面线」摆到结果卡里 */
  let sum = '<table class="reachsum"><thead><tr>'+
    '<th>段</th><th>里程 m</th><th>i</th><th>坡型</th><th>h₀</th><th>h_c</th><th>曲线</th>'+
    '</tr></thead><tbody>';
  R.reaches.forEach((r,k)=>{
    const segs = R.segments.filter(s=>s.reach_index===r.index);
    const types = segs.map(s=>s.curve_type).filter((v,idx,a)=>a.indexOf(v)===idx).join("/");
    const cls = r.slope_class==="mild" ? "mild" : (r.slope_class==="steep" ? "steep" : "other");
    sum += "<tr><td><span class='segdot s"+(k%4)+"'></span>"+(k+1)+"</td>"+
      "<td>"+f2(r.x_start,0)+"–"+f2(r.x_end,0)+"</td>"+
      "<td>"+Number(r.i).toPrecision(3)+"</td>"+
      "<td class='"+cls+"'>"+(SLOPE_TAG[r.slope_class]||r.slope_class)+"</td>"+
      "<td>"+(r.h0==null?"—":f2(r.h0,2))+"</td>"+
      "<td>"+f2(r.hc,2)+"</td>"+
      "<td>"+(types?"<span class='curvepill'>"+types+"</span>":"—")+"</td></tr>";
  });
  sum += "</tbody></table>";
  $("#reachSum").innerHTML = sum;

  /* 提示 + 注意事项 */
  const ws = R.warnings.filter(x=>x.level!=="info").map(x=>x.message);
  const cs = (R.facts && R.facts.cautions) || [];
  $("#warnBox").innerHTML = ws.concat(cs).map(m=>'<div class="witem">'+m+'</div>').join("");

  /* 力学依据 */
  const reasons = (R.facts && R.facts.reasons) || [];
  $("#reasonList").innerHTML = reasons.map(x=>"<li>"+x+"</li>").join("");
}

/* ---------------- 合法性提示 ---------------- */
const LEGALKIND={A:"ok",B:"ok",C:"ok",D:"ok",E:"warn",F:"bad",G:"bad",H:"warn",I:"bad"};
function renderLegal(L){
  const box = $("#legal");
  if(!box) return;
  if(!L){ box.style.display="none"; return; }
  const kind = LEGALKIND[L.code]||"warn";
  box.style.display="block";
  box.style.borderLeftColor = kind==="ok"?"#2f7d54":kind==="warn"?"#e0b877":"#b23c4a";
  box.style.background = kind==="ok"?"#f1f8f2":kind==="warn"?"#fdf6ec":"#fdf0f0";
  let h = '<b style="color:#16202b">'+L.code+' · '+(L.label||"")+'</b>';
  if(L.reasons && L.reasons.length) h += '<ul>'+L.reasons.map(r=>"<li>"+r+"</li>").join("")+'</ul>';
  if(L.hints && L.hints.length) h += '<div style="color:#5b6b7b;margin-top:3px">'+L.hints.join("<br>")+'</div>';
  box.innerHTML = h;
}

/* ---------------- 计算 ---------------- */
async function calc(){
  state.classKey = null;
  const btn = $("#calcBtn"); btn.disabled = true;
  $("#formHint").textContent = "计算中…"; $("#formHint").className = "hint";
  try{
    const j = await (await fetch("/api/solve",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({overrides:formParams()})})).json();
    renderLegal(j.legal);
    if(!j.ok){
      $("#formHint").textContent = "无法计算：" + ((j.legal&&j.legal.reasons||[]).join("；") || ("缺 "+(j.missing||[]).join("、")));
      $("#formHint").className = "hint err";
      return;
    }
    state.result = j.result;
    state.slots = j.slots || {};
    if(state.selectedX==null || state.selectedX<state.result.reaches[0].x_start
       || state.selectedX>state.result.reaches[state.result.reaches.length-1].x_end){
      const rs = state.result.reaches;
      state.selectedX = rs[0].x_start + 0.55*(rs[rs.length-1].x_end - rs[0].x_start);
    }
    syncForm(state.slots);
    $("#formHint").textContent = "参数已同步。"; $("#formHint").className = "hint";
    drawProfile(); drawSection(); renderResult(); loadHistory(); updateCtxChip(); renderChips();
  }catch(e){
    $("#formHint").textContent = "计算失败："+e.message; $("#formHint").className="hint err";
  }finally{ btn.disabled = false; }
}

/* ---------------- 历史 ---------------- */
async function loadHistory(){
  try{
    const j = await (await fetch("/api/history?limit=12")).json();
    const runs = j.runs||[];
    if(!runs.length){ $("#histBox").innerHTML='<div class="empty">暂无记录。</div>'; return; }
    $("#histBox").innerHTML = runs.map(r=>{
      const t = (r.ts||"").slice(11,16);
      const curve = (r.curves||[]).join("→") || "无曲线";
      const s = r.slots||{};
      const kv = ["b","n","i","Q"].filter(k=>s[k]!=null)
        .map(k=>k+"="+Number(Number(s[k]).toPrecision(3))).join(" ");
      return '<div class="hitem" data-id="'+r.id+'"><span class="t">'+t+'</span>'+
             '<span class="n">#'+r.id+' '+curve+' · '+kv+'</span></div>';
    }).join("");
    $("#histBox").querySelectorAll(".hitem").forEach(el=>{
      el.onclick = ()=>replay(parseInt(el.dataset.id,10));

/* ---------------- 对话 ---------------- */
async function send(){
  const text = $("#chatInput").value.trim(); if(!text) return;
  bubble(text,"me");
  $("#chatInput").value=""; $("#sendBtn").disabled=true;
  const wait = bubble("解析中…","ai","助手");
  try{
    const r = await (await fetch("/api/turn",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text, context:{x: state.selectedX}})})).json();
    wait.remove();
    if(r.error){ bubble("解析失败："+r.error,"ai","助手"); return; }
    /* 对话 → 图：回答里提到水跃/水跌/临界时，把选中点跳到该位置 */
    if(r.focus_x != null && state.result){
      state.selectedX = r.focus_x;
      $("#profileTag").textContent = "已跳到 x = "+Number(r.focus_x).toFixed(1)+" m";
      drawProfile(); drawSection(); updateCtxChip();
    }
    /* 有歧义：当次就问清楚，给一键切换，而不是按习惯猜完等用户再纠正 */
    renderAmbiguities(r.ambiguities);
    renderLegal(r.legal);
    state.slots = r.slots || {};
    syncForm(state.slots);

    const LAB = {section:"断面型式",b:"底宽",m:"边坡",n:"糙率",i:"底坡",Q:"流量",
                 h0:"水深",L:"渠长",downstream:"渠末条件",zw:"水位"};
    const shown = (r.added||[]).map(k=>{
      let v = state.slots[k];
      if(k==="section") v = v==="rectangular"?"矩形":"梯形";
      if(k==="downstream") v = {free_outfall:"自由跌水",given_h:"给定水深",
                                given_zw:"给定水位",normal_depth:"正常水深"}[v]||v;
      return (LAB[k]||k)+"="+v;
    });

    /* 0) 出题：根据当前算例生成教学题与参考答案 */
    if(r.act === "quiz"){
      if(r.reply) bubble(r.reply, "ai", "助手");
      renderQuiz(r.quiz || []);
      return;
    }

    /* 1) 提问 / 闲聊：直接回答，不追问参数 */
    if(r.act === "answer"){
      if(r.reply) bubble(r.reply, "ai", "助手");
      /* 问句里带了参数 → 服务端做了"试算"，当前参数并没有改 */
      if(r.hypothesis && r.hypothesis.slots){
        const hb = bubble("这是一组试算参数（当前参数未改动）。","ai","助手");
        const btn = document.createElement("button");
        btn.className = "ghost";
        btn.style.marginTop = "6px";
        btn.textContent = "应用到表单并计算";
        btn.onclick = ()=>applyHypothesis(r.hypothesis.slots, btn);
        hb.appendChild(document.createElement("br"));
        hb.appendChild(btn);
      }
      if(shown.length){
        bubble("同时记下了：" + shown.join("、"), "ai", "助手");
        $("#formHint").textContent = "已按对话同步：" + shown.join("  ");
        $("#formHint").className = "hint ok";
        flashSyncBadge(shown.length);
      }
      if(r.ready && shown.length) await calc();
      return;
    }

    /* 2) 记下了参数 */
    if(shown.length){
      bubble("已记录：" + shown.join("、"), "ai", "助手");
      $("#formHint").textContent = "已按对话同步：" + shown.join("  ");
      $("#formHint").className = "hint ok";
    }

    /* 3) 越界 / 主题不符：说清楚为什么，不追问 */
    if(r.legal && r.legal.verdict === "reject"){
      bubble("这个不能算：" + ((r.legal.reasons||[]).join("；")), "ai", "助手");
      return;
    }

    /* 4) 参数齐了 → 计算 */
    if(r.ready){ await calc(); return; }

    /* 5) 还不齐：只在用户明确说"算"时提示一次，否则不打扰 */
    if(r.act === "record_ask"){
      bubble("还差 " + (r.missing||[]).map(k=>LAB[k]||k).join("、") +
             " 就能算；补齐后自动出图，也可以点「载入示例」。", "ai", "助手");
    }
    /* 有歧义：当次就问清楚，给一键切换，而不是按习惯猜完等用户再纠正 */
    renderAmbiguities(r.ambiguities);  }catch(e){ wait.remove(); bubble("请求失败："+e.message,"ai","助手"); }
  finally{ $("#sendBtn").disabled=false; $("#chatInput").focus(); }
}

function renderAmbiguities(list){
  if(!list || !list.length) return;
  list.forEach(a=>{
    const b = bubble(a.question, "ai", "助手");
    const row = document.createElement("div");
    row.className = "pchips"; row.style.marginTop = "6px";
    (a.options || []).forEach(o=>{
      const c = document.createElement("span");
      c.className = "pchip"; c.textContent = o.label;
      c.onclick = ()=>{ row.remove(); applyPatch(o.patch, o.label); };
      row.appendChild(c);
    });
    b.appendChild(row);
  });
}

/* 按用户点选的那一种理解重算（歧义消除） */
async function applyPatch(patch, label){
  state.classKey = null;
  try{
    const overrides = Object.assign({}, state.slots || {}, patch);
    const j = await (await fetch("/api/solve",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({overrides})})).json();
    renderLegal(j.legal);
    if(!j.ok){
      bubble("按「"+(label||"该选项")+"」计算失败："+
             ((j.legal && j.legal.reasons || []).join("；") || "参数不合法"),"ai","助手");
      return;
    }
    state.result = j.result; state.slots = j.slots || {};
    syncForm(state.slots);
    const rs = state.result.reaches;
    state.selectedX = rs[0].x_start + 0.55*(rs[rs.length-1].x_end - rs[0].x_start);
    drawProfile(); drawSection(); renderResult(); loadHistory(); updateCtxChip(); renderChips();
    bubble("已按「"+(label||"该选项")+"」重新计算：" +
           state.result.segments.map(s=>s.curve_type).join(" → "),"ai","助手");
  }catch(e){ bubble("应用失败："+e.message,"ai","助手"); }
}

/* 把"试算出来的参数"落进表单并计算（用户点按钮才生效） */
async function applyHypothesis(slots, btn){

    state.selectedX = rs[0].x_start + 0.55*(rs[rs.length-1].x_end - rs[0].x_start);

/* ---------------- 视窗：缩放与精确定位 ---------------- */
function fullRange(){
  const R = state.result; if(!R) return null;
  return {x0: R.reaches[0].x_start, x1: R.reaches[R.reaches.length-1].x_end};
}
function syncXInput(){
  const el = $("#xInput");
  if(el && state.selectedX != null) el.value = Number(state.selectedX).toFixed(1);
}
function applyView(x0, x1){
  const fr = fullRange(); if(!fr) return;
  const full = fr.x1 - fr.x0;
  const minSpan = Math.max(full * 0.02, 0.5);
  x0 = Math.max(fr.x0, x0); x1 = Math.min(fr.x1, x1);
  if(x1 - x0 < minSpan){
    const c = (x0 + x1) / 2;
    x0 = c - minSpan / 2; x1 = c + minSpan / 2;
    if(x0 < fr.x0){ x0 = fr.x0; x1 = x0 + minSpan; }
    if(x1 > fr.x1){ x1 = fr.x1; x0 = x1 - minSpan; }
  }
  state.view = (x1 - x0 >= full - 1e-6) ? null : {x0, x1};
  drawProfile();
}
function zoomBy(k, anchorX){
  const fr = fullRange(); if(!fr) return;
  const v = state.view || {x0: fr.x0, x1: fr.x1};
  const a = (anchorX == null) ? (v.x0 + v.x1) / 2
                              : Math.min(Math.max(anchorX, v.x0), v.x1);
  const span = (v.x1 - v.x0) * k;
  const f = (a - v.x0) / ((v.x1 - v.x0) || 1);
  applyView(a - span * f, a - span * f + span);
}
/* 输入 x 精确定位：图、横断面、数据一起跟上 */
function goToX(x){
  const fr = fullRange(); if(!fr) return;
  if(!isFinite(x)){ bubble("请输入一个数字，例如 100","ai","助手"); return; }
  x = Math.min(Math.max(x, fr.x0), fr.x1);
  state.selectedX = x;
  const v = state.view;
  if(v && (x < v.x0 || x > v.x1)){
    const w = v.x1 - v.x0;
    applyView(x - w / 2, x + w / 2);
  }
  $("#profileTag").textContent = "已定位 x = " + x.toFixed(1) + " m";
  drawProfile(); drawSection(); updateCtxChip(); syncXInput();
}

function bindCanvas(){
  const cv = $("#profile"), tip = $("#profileTip");
  cv.addEventListener("mousemove", ev=>{
    const g = cv._geo; if(!g || !state.result) return;
    const r = cv.getBoundingClientRect();
    const px = ev.clientX-r.left;
    if(px<g.pad.l || px>g.w-g.pad.r){ tip.classList.remove("on"); state.hover=null; drawProfile(); return; }
    const x = g.x0 + (px-g.pad.l)/(g.w-g.pad.l-g.pad.r)*(g.xL-g.x0);
    const h = waterAt(x);
    if(h==null){ tip.classList.remove("on"); return; }
    const rch = reachAt(x);
    const fr = frAt(x);
    state.hover = x;
    const reg = (segAt(x)||{}).s;
    tip.innerHTML = "x = "+x.toFixed(1)+" m<br>水深 h = "+h.toFixed(3)+" m<br>"+
      "水位 z = "+(zbAt(x)+h).toFixed(3)+" m<br>"+
      (fr!=null ? "Fr = "+fr.toFixed(2)+" · " : "")+
      (reg ? (reg.curve_type+" "+REGIME_CN[reg.regime]) : "");
    tip.style.left = px+"px";
    tip.style.top = (ev.clientY-r.top)+"px";
    tip.classList.add("on");
    drawProfile();
  });
  cv.addEventListener("mouseleave", ()=>{ tip.classList.remove("on"); state.hover=null; drawProfile(); });
  cv.addEventListener("click", ev=>{
    const g = cv._geo; if(!g || !state.result) return;
    const r = cv.getBoundingClientRect();
    const px = ev.clientX-r.left;
    if(px<g.pad.l || px>g.w-g.pad.r) return;
    const x = g.x0 + (px-g.pad.l)/(g.w-g.pad.l-g.pad.r)*(g.xL-g.x0);
    state.selectedX = Math.min(Math.max(x, g.x0), g.xL);
    $("#profileTag").textContent = "已选 x = "+state.selectedX.toFixed(1)+" m";
    drawProfile(); drawSection(); updateCtxChip(); syncXInput();
  });

  /* 滚轮缩放（以鼠标位置为锚点） */
  cv.addEventListener("wheel", ev=>{
    if(!state.result) return;
    ev.preventDefault();
    const g = cv._geo; if(!g) return;
    const r = cv.getBoundingClientRect();
    const f = Math.min(Math.max((ev.clientX - r.left - g.pad.l) / (g.w - g.pad.l - g.pad.r), 0), 1);
    zoomBy(ev.deltaY < 0 ? 0.8 : 1.25, g.x0 + f * (g.xL - g.x0));
  }, {passive:false});

  /* 双击图面复位 */
  cv.addEventListener("dblclick", ()=>{ state.view = null; drawProfile(); });

  /* 右上角：放大 / 缩小 / 复位 / x 精确输入 */
  const zin = $("#zoomIn"), zout = $("#zoomOut"), zr = $("#zoomReset");
  if(zin)  zin.addEventListener("click", ()=>zoomBy(0.7, state.selectedX));
  if(zout) zout.addEventListener("click", ()=>zoomBy(1.4, state.selectedX));
  if(zr)   zr.addEventListener("click", ()=>{ state.view = null; drawProfile(); });
  const xi = $("#xInput");
  if(xi){
    xi.addEventListener("keydown", e=>{
      if(e.key === "Enter"){ e.preventDefault(); goToX(parseFloat(xi.value)); }
    });
    xi.addEventListener("change", ()=>goToX(parseFloat(xi.value)));
  }
}

/* 图上选中的点 → 对话上下文（图与对话互通） */
function updateCtxChip(){
  const el = $("#chatCtx"); if(!el) return;
  if(state.selectedX==null || !state.result){ el.style.display="none"; return; }
  const seg = state.result.segments.find(s=>
    state.selectedX >= Math.min(s.x[0], s.x[s.x.length-1])-1e-6 &&
    state.selectedX <= Math.max(s.x[0], s.x[s.x.length-1])+1e-6);
  const ctype = seg ? seg.curve_type : "";
  el.innerHTML = '<span>对话将带上选中位置：<b>x = '+state.selectedX.toFixed(1)+' m</b>' +
                 (ctype ? ' · '+ctype : '') + '</span>' +
                 '<span class="x" title="取消选中" id="ctxClear">✕</span>';
  el.style.display = "flex";
  const clr = $("#ctxClear");
  if(clr) clr.onclick = ()=>{ state.selectedX = null; $("#chatCtx").style.display="none"; drawProfile(); };
}

/* 对话区可拖动改变高度（记住上次的高度） */
function bindChatResizer(){
  const bar = $("#chatResizer"), body = $("#chatBody");
  if(!bar || !body) return;
  const saved = localStorage.getItem("chatH");
  if(saved) body.style.height = saved;
  let dragging = false, y0 = 0, h0 = 0;
  bar.addEventListener("mousedown", e=>{
    dragging = true; y0 = e.clientY; h0 = body.offsetHeight;
    document.body.style.userSelect = "none"; e.preventDefault();
  });
  window.addEventListener("mousemove", e=>{
    if(!dragging) return;
    const nh = Math.max(160, Math.min(900, h0 + (e.clientY - y0)));
    body.style.height = nh + "px";
  });
  window.addEventListener("mouseup", ()=>{
    if(!dragging) return;
    dragging = false; document.body.style.userSelect = "";
    localStorage.setItem("chatH", body.style.height || "");
  });
  /* 双击恢复默认高度 */
  bar.addEventListener("dblclick", ()=>{
    body.style.height = ""; localStorage.removeItem("chatH");
  });
}

const BASE_CHIPS = [
  "你会什么？",
  "怎么用？",
  "什么是临界水深？",
  "水跃是怎么判定的？",
  "正常水深和临界水深有什么区别？",
  "临界底坡是怎么算的？",
  "水跌和水跃的区别是什么？",
  "跃长公式有哪几种？",
  "为什么缓坡上会出现 M2？",
  "多段渠道之间怎么衔接？",
  "糙率取大了会怎样？",
  "这个系统不适合算什么？"
];

let _genPtr = 0;
/* 通用问题轮换：每次渲染换一组，让「猜你想问」一直在变 */
function pickGeneral(n){
  const out = [];
  for(let i=0;i<n && i<BASE_CHIPS.length;i++){
    out.push(BASE_CHIPS[(_genPtr + i) % BASE_CHIPS.length]);
  }
  _genPtr = (_genPtr + n) % BASE_CHIPS.length;
  return out;
}

/* 「猜你想问」：跟随当前工况变化，而不是永远问"为什么是M1" */
function renderChips(){
  const holder = $("#chips"); if(!holder) return;
  const R = state.result;
  const chips = [];
  if(R && R.segments && R.segments.length){
    const types = [...new Set(R.segments.map(s=>s.curve_type))];
    chips.push("这个工况为什么是"+types.join("/")+"？");
    const kinds = new Set((R.transitions||[]).map(t=>t.kind));
    if(kinds.has("jump")) chips.push("水跃在哪个位置？跃长怎么算？");
    if(kinds.has("outfall")) chips.push("渠末为什么会形成水跌？");
    if(kinds.has("critical")) chips.push("坡折处为什么正好是临界水深？");
    const rs = R.reaches || [];
    if(rs.length > 1) chips.push("两段之间是怎么衔接的？");
    chips.push("请根据现有水面线试着出一些题目");
  }else{
    chips.push("怎么用？", "给我一个水跃样例", "给我一个坡折水跌样例");
  }
  const all = chips.concat(pickGeneral(4)).slice(0, 8);
  holder.innerHTML =
    '<span class="chips-hint">猜你想问</span>' +
    '<span class="chip" id="chipDemo" title="恢复默认的两段变坡示例">▶ 载入两段变坡示例</span>' +
    all.map(c=>'<span class="chip">'+c+'</span>').join("") +
    '<span class="chip" id="chipX" title="输入里程 x，定位到该点查看横断面与数据">x = ? 处的水深 / Fr</span>';
  const demo = $("#chipDemo");
  if(demo) demo.onclick = ()=>loadDemo(true);
  const cx = $("#chipX");
  if(cx) cx.onclick = ()=>{ const xi = $("#xInput"); if(xi){ xi.focus(); xi.select(); } };
  holder.querySelectorAll(".chip").forEach(el=>{
    if(el.id === "chipDemo" || el.id === "chipX") return;
    el.onclick = ()=>{ $("#chatInput").value = el.textContent; send(); };
  });
}

/* 默认示例：两段变坡，坡度不同 —— 用来展示坡折处的水面线衔接 */
const DEMO_FORM = {
  Q: 10,
  reaches: [{L:300, i:0.001, b:5, m:0, n:0.015},
            {L:300, i:0.020, b:5, m:0, n:0.015}],
  up: "none", upH: null, down: "free_outfall", downH: null
};

function loadDemo(notify){
  state.classKey = null;
  const f = state.form;
  f.Q = DEMO_FORM.Q;
  f.reaches = DEMO_FORM.reaches.map(r=>Object.assign({}, r));
  f.up = DEMO_FORM.up; f.upH = DEMO_FORM.upH;
  f.down = DEMO_FORM.down; f.downH = DEMO_FORM.downH;
  syncForm();
  $("#formHint").textContent = "已载入默认两段变坡示例。";
  $("#formHint").className = "hint ok";
  if(notify) bubble("已载入默认示例：两段变坡（缓坡 0.001 → 陡坡 0.020），看坡折处的水面线衔接。","ai","助手");
  calc();
}

async function init(){
  renderChips();
  bubble("你好，直接用一句话描述渠道即可；也可以逐条补充参数，我会累加。","ai","助手");
  sysNote("提示：计算由本地 Python 内核算，本页只负责显示；模型只做语言解析。");

  bindForm(); bindCanvas();
  bindChatResizer();
  $("#sendBtn").addEventListener("click", send);
  $("#chatInput").addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });
  $("#resetBtn").addEventListener("click", async ()=>{
    try{ await fetch("/api/reset",{method:"POST"}); }catch(e){}
    state.result=null; state.slots={}; state.selectedX=null;
    state.form = {Q:10, mode:state.form.mode, alpha:state.form.alpha, beta:state.form.beta, jump:"wu",
                  reaches:[{L:300,i:0.001,b:5,m:0,n:0.015},
                           {L:300,i:0.020,b:5,m:0,n:0.015}],
                  up:"none", upH:null, down:"free_outfall", downH:null};
    /* 清空 = 参数 + 对话记录 一起清掉 */
    $("#chatBody").innerHTML = "";
    syncForm(); renderLegal(null);
    $("#formHint").textContent = "已回到默认两段变坡示例。"; $("#formHint").className = "hint ok";
    $("#badges").innerHTML='<span style="color:#8b98a6;font-size:12.5px">尚未计算</span>';
    $("#kvBox").innerHTML=""; $("#warnBox").innerHTML=""; $("#reasonList").innerHTML="";
    $("#propsTable").innerHTML=""; $("#statusTag").textContent=""; $("#sectionTag").textContent="未选择位置";
    drawProfile(); drawSection();
    bubble("已清空参数和对话记录，可以重新开始。","ai","助手");
  });

  /* 健康检查 + 预设列表 + 历史 + 会话状态 */
  try{
    const h = await (await fetch("/api/health")).json();
    const info = h.llm_info || {};
    const ok = !!h.llm;
    let label;
    if(info.provider === "deepseek"){
      label = ok ? ("AI 在线 · DeepSeek " + (info.model||"")) : "AI 未就绪 · 仅规则解析";
    }else if(info.provider === "ollama"){
      label = ok ? ("本地模型 · " + (info.model||"")) : "本地模型未启动 · 仅规则解析";
    }else{
      label = "AI 关闭 · 仅规则解析";
    }
    if(!ok && info.note) label = info.note;
    $("#aiStatus").innerHTML = '<i class="dot'+(ok?"":" off")+'"></i>' + label;
  }catch(e){ $("#aiStatus").innerHTML='<i class="dot off"></i>AI 状态未知'; }

  await loadPresets();

  try{
    const s = await (await fetch("/api/state")).json();
    if(s.slots && Object.keys(s.slots).length){
      state.slots = s.slots; syncForm(s.slots);
      renderLegal(s.legal);
      const single = (s.slots.reaches && s.slots.reaches.length === 1)
                     || (!s.slots.reaches && s.slots.b != null);
      bubble("已恢复上次的参数，左侧表单已同步。" +
             (single ? "当前是单段渠道；想回到默认两段变坡示例，点「载入示例」或「清空」。" : ""),
             "ai","助手");
    }else{
      syncForm();
      bubble("当前载入默认示例：两段变坡（缓坡 0.001 → 陡坡 0.020），可直接看坡折处的水面线衔接。","ai","助手");
    }
  }catch(e){ syncForm(); }

  loadHistory();
  await calc();                 // 首次载入直接算默认两段算例，页面不为空
  drawProfile(); drawSection();

  const auto = new URLSearchParams(location.search).get("q");
  if(auto){ $("#chatInput").value = auto; setTimeout(send, 200); }
}
init();
