; ---------------------------------------------------------------
; 模型通道配置
;
; 复制本文件为 config.ini 后填写（config.ini 已在 .gitignore 中，
; 不会被提交，也不会随便携版打包泄露）。
;
; provider:
;   deepseek  调用 DeepSeek 官方 API（默认）
;   ollama    调用本地 Ollama（完全离线）
;   none      只用规则解析
;
; api_key 也可以放在环境变量 DEEPSEEK_API_KEY 里，环境变量优先。
; ---------------------------------------------------------------
[llm]
provider = deepseek
model = deepseek-chat
base_url = https://api.deepseek.com
api_key =

; provider = ollama 时生效
ollama_url = http://127.0.0.1:11434
ollama_model = qwen3:4b-nothink

; 单次请求超时（秒）
timeout = 30

; 本机限流：每小时最多调用模型多少次（0 = 不限）
; 系统只监听 127.0.0.1，并拒绝其他站点的跨域请求；万一 key 外泄，
; 这个上限能把被滥用的代价控制在很小的范围。
max_calls_per_hour = 240
